<!doctype html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin · ELECTION LIVE</title><link rel="stylesheet" href="styles.css"></head><body><div class="shell narrow"><header class="topbar"><div><div class="eyebrow">ADMIN CONTROL</div><h1>แผงควบคุมการเลือกตั้ง</h1><p class="muted">แดชบอร์ดสดและเครื่องมือจัดการเนื้อหาหน้าเว็บ</p></div><a class="button ghost" href="index.html">ดูหน้าเว็บ</a></header><main class="admin-grid"><section class="panel"><h2>แดชบอร์ดคะแนนสด</h2><div class="admin-stat"><span>คะแนนที่เปิดเผย</span><b id="adminTotal">0</b></div><div class="admin-stat"><span>ผู้สมัครที่นำ</span><b id="adminLeader">-</b></div><div class="admin-stat"><span>สถานะ</span><b id="adminState">หยุดอยู่</b></div><label>ความเร็ว (วินาทีต่อ 1 คะแนน)<input id="speed" type="number" min="1" value="2"></label><div class="actions"><button id="start" class="button">เริ่มปล่อยคะแนน</button><button id="stop" class="button danger">หยุด / รีเซ็ต</button></div><div id="adminBoard" class="admin-board"></div></section><section class="panel"><h2>แก้ไขสิ่งที่แสดงหน้าเว็บ</h2><label>หัวข้อหลัก<input id="editTitle"></label><label>คำอธิบาย<input id="editSubtitle"></label><label>ลิงก์โลโก้<input id="editLogo" placeholder="https://..."></label><h3 class="edit-heading">ข้อมูลผู้สมัคร</h3><div id="candidateEditor"></div><button id="saveContent" class="button save">บันทึกข้อมูลหน้าเว็บ</button><div class="notice">ข้อมูลแก้ไขจะถูกบันทึกในเบราว์เซอร์นี้ก่อน เมื่อเชื่อมระบบจริงจะย้ายไปเก็บในฐานข้อมูลแอดมิน</div></section></main></div><script src="config.js"></script><script src="app.js"></script><script src="admin.js"></script></body></html>
